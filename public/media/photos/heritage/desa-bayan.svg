<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="morningSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="rinjaniPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="forestValley" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#morningSky)" />

  <!-- Mount Rinjani Majestic Silhouette in Background -->
  <polygon points="400,100 650,420 150,420" fill="url(#rinjaniPeak)" />
  <!-- Crater caldera rim detail -->
  <polygon points="400,100 440,150 490,140 530,220 320,220 370,140" fill="#0f172a" opacity="0.4" />

  <!-- Forest Foothills of Bayan -->
  <path d="M 0 350 Q 200 300 450 340 T 800 320 L 800 600 L 0 600 Z" fill="url(#forestValley)" />

  <!-- Traditional Sasak Rice Terraces & Village -->
  <path d="M 0 450 Q 250 420 500 460 T 800 430 L 800 600 L 0 600 Z" fill="#166534" />

  <!-- Badge Label -->
  <g transform="translate(60, 490)">
    <rect x="0" y="0" width="360" height="65" rx="14" fill="#0f172a" fill-opacity="0.92" stroke="#38bdf8" stroke-width="2" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#f8fafc">Lanskap Bayan &amp; Gn. Rinjani</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Lombok Utara, NTB • Harmoni Alam dan Budaya</text>
  </g>
</svg>
