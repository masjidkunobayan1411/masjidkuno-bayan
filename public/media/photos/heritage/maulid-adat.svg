<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="festiveSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#festiveSky)" />
  <rect y="400" width="800" height="200" fill="url(#groundGrad)" />

  <!-- Procession of Praja Mulud Adat Bayan -->
  <!-- Traditional Parasols (Payung Adat Kuning Emas) -->
  <g transform="translate(180, 240)">
    <line x1="50" y1="0" x2="50" y2="180" stroke="#78350f" stroke-width="6" />
    <path d="M 0 50 Q 50 10 100 50 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />
    <circle cx="50" cy="8" r="6" fill="#ca8a04" />
  </g>

  <g transform="translate(420, 220)">
    <line x1="50" y1="0" x2="50" y2="200" stroke="#78350f" stroke-width="6" />
    <path d="M 0 50 Q 50 10 100 50 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <circle cx="50" cy="8" r="6" fill="#facc15" />
  </g>

  <!-- People Silhouette in Poleng Attire -->
  <g transform="translate(200, 360)">
    <!-- Person 1 -->
    <circle cx="30" cy="20" r="14" fill="#1e293b" />
    <polygon points="20,10 30,0 40,10" fill="#dc2626" /> <!-- Sapuk -->
    <rect x="15" y="35" width="30" height="40" fill="#ffffff" />
    <rect x="15" y="75" width="30" height="50" fill="#0f172a" /> <!-- Kain -->
  </g>

  <g transform="translate(320, 350)">
    <!-- Person 2 -->
    <circle cx="30" cy="20" r="14" fill="#1e293b" />
    <polygon points="20,10 30,0 40,10" fill="#dc2626" />
    <rect x="15" y="35" width="30" height="45" fill="#f8fafc" />
    <rect x="15" y="80" width="30" height="55" fill="#991b1b" />
  </g>

  <g transform="translate(450, 360)">
    <!-- Person 3 -->
    <circle cx="30" cy="20" r="14" fill="#1e293b" />
    <polygon points="20,10 30,0 40,10" fill="#ca8a04" />
    <rect x="15" y="35" width="30" height="40" fill="#ffffff" />
    <rect x="15" y="75" width="30" height="50" fill="#0f172a" />
  </g>

  <!-- Badge Label -->
  <g transform="translate(60, 490)">
    <rect x="0" y="0" width="360" height="65" rx="14" fill="#0f172a" fill-opacity="0.92" stroke="#ea580c" stroke-width="2" />
    <text x="20" y="28" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#f8fafc">Tradisi &amp; Maulid Adat Bayan</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Kirab Praja Mulud • Kearifan Komunitas Adat</text>
  </g>
</svg>
