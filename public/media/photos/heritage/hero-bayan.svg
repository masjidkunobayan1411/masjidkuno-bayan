<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="heroMountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="heroHills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="heroWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="heroRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1200" height="800" fill="url(#heroSky)" />

  <!-- Mount Rinjani in Background -->
  <polygon points="600,120 950,550 250,550" fill="url(#heroMountain)" opacity="0.85" />
  <polygon points="600,120 660,200 740,180 820,300 480,300 550,200" fill="#0c4a6e" opacity="0.4" />

  <!-- Hills & Greenery -->
  <path d="M 0 460 Q 300 380 600 440 T 1200 410 L 1200 800 L 0 800 Z" fill="url(#heroHills)" />
  <path d="M 0 540 Q 350 480 750 540 T 1200 510 L 1200 800 L 0 800 Z" fill="#047857" opacity="0.9" />

  <!-- Main Mosque Building Architecture (Central Focus) -->
  <g transform="translate(300, 260)">
    <!-- Natural Stone Base Mound (Pondasi Batu Kali) -->
    <polygon points="100,380 500,380 540,430 60,430" fill="#475569" />
    <polygon points="60,430 540,430 560,470 40,470" fill="#1e293b" />

    <!-- Wooden Foundation Pillars -->
    <rect x="130" y="320" width="22" height="60" fill="url(#heroWood)" />
    <rect x="290" y="320" width="22" height="60" fill="url(#heroWood)" />
    <rect x="450" y="320" width="22" height="60" fill="url(#heroWood)" />

    <!-- Woven Bamboo Walls with Modern Detail -->
    <rect x="110" y="190" width="380" height="130" rx="4" fill="#d97706" stroke="#92400e" stroke-width="3" />
    <!-- Sacred Entry Door -->
    <rect x="270" y="215" width="60" height="105" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
    <circle cx="280" cy="270" r="4" fill="#fbbf24" />

    <!-- Lower Thatched Roof Tier (Atap Ijuk) -->
    <polygon points="300,50 580,200 20,200" fill="url(#heroRoof)" />
    <line x1="20" y1="200" x2="580" y2="200" stroke="#0f172a" stroke-width="6" />

    <!-- Upper Thatched Tier (Atap Tumpang Tingkat Dua) -->
    <polygon points="300,-50 480,60 120,60" fill="url(#heroRoof)" />
    <line x1="120" y1="60" x2="480" y2="60" stroke="#0f172a" stroke-width="6" />

    <!-- Crown Finial Apex (Mahkota Bayan) -->
    <polygon points="300,-85 292,-50 308,-50" fill="#f59e0b" />
    <circle cx="300" cy="-88" r="8" fill="#fbbf24" />
  </g>

  <!-- Coconut Palms & Trees -->
  <g transform="translate(80, 420)">
    <circle cx="60" cy="0" r="70" fill="#065f46" />
    <circle cx="40" cy="40" r="50" fill="#047857" />
  </g>
  <g transform="translate(1000, 400)">
    <circle cx="80" cy="0" r="80" fill="#065f46" />
    <circle cx="110" cy="50" r="60" fill="#047857" />
  </g>

  <!-- Modern Pill Badge Overlay -->
  <g transform="translate(70, 680)">
    <rect x="0" y="0" width="460" height="75" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#3b82f6" stroke-width="2" />
    <circle cx="40" cy="37" r="10" fill="#2563eb" />
    <text x="65" y="33" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">Cagar Budaya Masjid Kuno Bayan</text>
    <text x="65" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd">Situs Bersejarah Abad XVI • Lombok Utara, NTB</text>
  </g>
</svg>
