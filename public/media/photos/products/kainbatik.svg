<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="batikBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="batikGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0" />
    </radialGradient>
    <pattern id="batikMotif" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Diamond base -->
      <polygon points="50,10 90,50 50,90 10,50" fill="#92400e" opacity="0.6" stroke="#fbbf24" stroke-width="1.5" />
      <polygon points="50,25 75,50 50,75 25,50" fill="#451a03" opacity="0.8" stroke="#d97706" stroke-width="1" />
      <!-- Floral central petal -->
      <circle cx="50" cy="50" r="8" fill="#fbbf24" />
      <circle cx="50" cy="35" r="4" fill="#fef3c7" />
      <circle cx="50" cy="65" r="4" fill="#fef3c7" />
      <circle cx="35" cy="50" r="4" fill="#fef3c7" />
      <circle cx="65" cy="50" r="4" fill="#fef3c7" />
      <!-- Corner floral -->
      <circle cx="0" cy="0" r="6" fill="#d97706" />
      <circle cx="100" cy="0" r="6" fill="#d97706" />
      <circle cx="0" cy="100" r="6" fill="#d97706" />
      <circle cx="100" cy="100" r="6" fill="#d97706" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#batikBg)" />
  <rect width="800" height="600" fill="url(#batikGlow)" />

  <!-- Fabric Canvas -->
  <g transform="translate(60, 40)">
    <!-- Shadow -->
    <rect x="15" y="15" width="650" height="490" rx="20" fill="#000000" opacity="0.45" />

    <!-- Batik Cloth Body -->
    <rect x="0" y="0" width="650" height="490" rx="16" fill="url(#batikMotif)" />

    <!-- Ornate Golden Border -->
    <rect x="0" y="0" width="650" height="28" rx="4" fill="#d97706" opacity="0.95" />
    <rect x="0" y="462" width="650" height="28" rx="4" fill="#d97706" opacity="0.95" />
    
    <line x1="0" y1="28" x2="650" y2="28" stroke="#f59e0b" stroke-width="2" />
    <line x1="0" y1="462" x2="650" y2="462" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Badge Label Overlay -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="320" height="70" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#fbbf24" stroke-width="2" />
    <text x="24" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">Kain Batik Sasak Lombok</text>
    <text x="24" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Pria &amp; Wanita • Tenun Etnik Sasak</text>
  </g>
</svg>
