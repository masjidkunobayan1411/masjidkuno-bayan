<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sapukBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="redSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#sapukBg)" />

  <!-- Shadow Canvas -->
  <g transform="translate(60, 40)">
    <rect x="15" y="15" width="650" height="490" rx="20" fill="#000000" opacity="0.45" />
    <rect x="0" y="0" width="650" height="490" rx="16" fill="#1e293b" />

    <!-- Sapuk Headband Fold Representation -->
    <!-- Crown Base -->
    <path d="M 120 280 Q 325 180 530 280 L 510 320 Q 325 240 140 320 Z" fill="url(#redSilk)" />
    <!-- Golden Woven Embroidery Edge -->
    <path d="M 120 280 Q 325 180 530 280 L 525 292 Q 325 195 125 292 Z" fill="url(#goldSilk)" />

    <!-- Sapuk Front Peak (Lipatan Khas Bayan) -->
    <polygon points="325,120 280,220 370,220" fill="url(#goldSilk)" />
    <polygon points="325,140 295,220 355,220" fill="url(#redSilk)" />

    <!-- Sabuk Anteng (Waist Sash) Representation below -->
    <g transform="translate(100, 360)">
      <rect x="0" y="0" width="450" height="40" rx="6" fill="url(#goldSilk)" />
      <!-- Repeating rhombus on sash -->
      <polygon points="40,20 60,8 80,20 60,32" fill="#78350f" />
      <polygon points="120,20 140,8 160,20 140,32" fill="#78350f" />
      <polygon points="200,20 220,8 240,20 220,32" fill="#78350f" />
      <polygon points="280,20 300,8 320,20 300,32" fill="#78350f" />
      <polygon points="360,20 380,8 400,20 380,32" fill="#78350f" />
    </g>
  </g>

  <!-- Badge Label Overlay -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="350" height="70" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#f59e0b" stroke-width="2" />
    <text x="24" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">Sapuk &amp; Sabuk Anteng</text>
    <text x="24" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Ikat Kepala &amp; Sabuk Pinggang Adat Sasak</text>
  </g>
</svg>
