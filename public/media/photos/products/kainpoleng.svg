<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <pattern id="polengPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="#1e293b" />
      <rect x="30" y="0" width="30" height="30" fill="#f8fafc" />
      <rect x="0" y="30" width="30" height="30" fill="#991b1b" />
      <rect x="30" y="30" width="30" height="30" fill="#334155" />
      <!-- Weave lines -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#000000" stroke-width="1" opacity="0.15" />
      <line x1="0" y1="30" x2="60" y2="30" stroke="#000000" stroke-width="1" opacity="0.15" />
      <line x1="0" y1="0" x2="0" y2="60" stroke="#000000" stroke-width="1" opacity="0.15" />
      <line x1="30" y1="0" x2="30" y2="60" stroke="#000000" stroke-width="1" opacity="0.15" />
    </pattern>
    <linearGradient id="clothShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Fabric Canvas -->
  <g transform="translate(60, 40)">
    <!-- Cloth Drop Shadow -->
    <rect x="15" y="15" width="650" height="490" rx="20" fill="#000000" opacity="0.4" />

    <!-- Poleng Cloth Body -->
    <rect x="0" y="0" width="650" height="490" rx="16" fill="url(#polengPattern)" />
    <!-- Cloth fold lighting effect -->
    <rect x="0" y="0" width="650" height="490" rx="16" fill="url(#clothShadow)" />

    <!-- Traditional Woven Gold Border Top & Bottom -->
    <rect x="0" y="0" width="650" height="32" rx="4" fill="#d97706" opacity="0.95" />
    <rect x="0" y="458" width="650" height="32" rx="4" fill="#d97706" opacity="0.95" />
    
    <!-- Border details -->
    <line x1="0" y1="32" x2="650" y2="32" stroke="#b45309" stroke-width="3" />
    <line x1="0" y1="458" x2="650" y2="458" stroke="#b45309" stroke-width="3" />
  </g>

  <!-- Badge Label Overlay -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="320" height="70" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#d97706" stroke-width="2" />
    <text x="24" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#f8fafc">Kain Poleng Sasak Bayan</text>
    <text x="24" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1">Busana Wajib Pria • Motif Kotak Suci</text>
  </g>
</svg>
